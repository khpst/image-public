name: Generate Image Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'
      - '.github/**'
      - 'scripts/**'
      - 'README.md'
      - '.gitignore'

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate manifest.json
        run: |
          python3 - <<'PYEOF'
          import os, json, datetime

          REPO_OWNER = "khpst"
          REPO_NAME  = "image-public"
          BRANCH     = "main"
          BASE_URL   = f"https://cdn.jsdelivr.net/gh/{REPO_OWNER}/{REPO_NAME}@{BRANCH}"

          SUPPORTED_EXTENSIONS = {".jpg", ".jpeg", ".png", ".gif", ".webp", ".svg", ".avif", ".ico"}
          SKIP_DIRS = {".git", ".github", "scripts"}

          images = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".") and d not in SKIP_DIRS]

              for filename in sorted(files):
                  _, ext = os.path.splitext(filename)
                  if ext.lower() not in SUPPORTED_EXTENSIONS:
                      continue

                  rel = os.path.relpath(os.path.join(root, filename)).replace("\\", "/")
                  parts = rel.split("/")
                  project = parts[0]

                  images.append({
                      "project": project,
                      "path":    rel,
                      "url":     f"{BASE_URL}/{rel}"
                  })

          manifest = {
              "generated_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "base_url":     BASE_URL,
              "image_count":  len(images),
              "images":       images
          }

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Manifest written: {len(images)} image(s)")
          PYEOF

      - name: Commit manifest if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json unchanged, skipping commit"
          else
            git commit -m "ci: regenerate manifest.json [skip ci]"
            git push origin main
          fi
